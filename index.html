<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My C Web Server</title>
    <style>
        /* මූලික සැකසුම් */
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #333;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* ප්‍රධාන Card එක */
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 500px;
            width: 90%;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-10px);
        }

        /* Header එක */
        h1 {
            color: #1e3c72;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.1rem;
            color: #666;
            line-height: 1.6;
        }

        /* සර්වර් Status Badge එක */
        .status-container {
            margin: 25px 0;
        }

        .status-dot {
            height: 12px;
            width: 12px;
            background-color: #2ecc71;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(46, 204, 113, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
        }

        .status-text {
            color: #2ecc71;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* විස්තර සහිත ලැයිස්තුව */
        .details {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            text-align: left;
            margin-top: 20px;
        }

        .details code {
            background: #ddd;
            padding: 2px 6px;
            border-radius: 4px;
            color: #d63384;
        }

        /* Footer */
        .footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Hello World!</h1>
        <p>Server is Successfully.This page written by C language and through <b>Custom Web Server</b> .</p>

        <div class="status-container">
            <span class="status-dot"></span>
            <span class="status-text">Server Online</span>
        </div>

        <div class="details">
            <b>Server Info:</b><br>
            • Protocol: <code>HTTP/1.1</code><br>
            • Port: <code>8080</code><br>
            • Language: <code>C (Sockets)</code>
        </div>

        <div class="footer">
            Developed by University of Colombo School of Computing
        </div>
    </div>

</body>
</html>
